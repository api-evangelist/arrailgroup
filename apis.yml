name: Arrail Group
description: >-
  Arrail Group (瑞尔集团) is one of the largest privately owned dental service
  providers in China, operating premium Arrail Dental clinics and the Rytime
  Dental (瑞泰口腔) network across major Chinese cities. The company delivers
  general dentistry, orthodontics, implants, and pediatric dental care through
  directly operated clinics and hospitals. It is listed on the Hong Kong Stock
  Exchange and counts Qiming Venture Partners among its investors. Arrail Group
  was added to the API Evangelist network as a Qiming portfolio company; it is a
  consumer healthcare provider and publishes no public developer API, SDK, or
  documentation surface at this time.
